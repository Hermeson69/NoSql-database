services:
  cassandra:
    build:
      context: .
      dockerfile: dockerfile
    image: nosql-database-cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -u cassandra -p cassandra localhost 9042 -e 'SELECT cluster_name FROM system.local' >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    mem_limit: 2g
    ulimits:
      nofile: 100000
      memlock: -1
    restart: unless-stopped

volumes:
  cassandra_data:
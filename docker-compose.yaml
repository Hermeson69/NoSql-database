services:
  cassandra:
    build:
      context: .
      dockerfile: dockerfile
    image: nosql-database-cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -u cassandra -p cassandra localhost 9042 -e 'SELECT cluster_name FROM system.local' >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    mem_limit: 2g
    ulimits:
      nofile: 100000
      memlock: -1
    restart: unless-stopped

  cassandra-init:
    image: nosql-database-cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"
    environment:
      APP_USERNAME: ${APP_USERNAME:-root}
      APP_PASSWORD: ${APP_PASSWORD:-root}
    entrypoint:
      - bash
      - -c
      - |
        until cqlsh cassandra -u cassandra -p cassandra -e "CREATE ROLE IF NOT EXISTS $$APP_USERNAME WITH PASSWORD = '$$APP_PASSWORD' AND SUPERUSER = true AND LOGIN = true;"; do
          echo "aguardando cassandra..."; sleep 5
        done
        echo "usuário $$APP_USERNAME criado ou já existente."


volumes:
  cassandra_data: